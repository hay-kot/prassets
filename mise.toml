[tools]
go = "latest"
golangci-lint = "latest"
goreleaser = "latest"
"github:gotestyourself/gotestsum" = "latest"

[env]
PRASSETS_LOG_LEVEL = "debug"

[tasks.run]
description = "Run pra"
run = "go run ./cmd/pra"

[tasks.build]
description = "Build the pra binary with goreleaser"
run = "goreleaser build --snapshot --clean"

[tasks.test]
description = "Run all go tests using gotestsum"
run = "gotestsum ./..."

[tasks."test:watch"]
description = "Run all go tests in watch mode"
run = "gotestsum --watch -- -v ./..."

[tasks.coverage]
description = "Run tests with race detection and coverage"
run = "go test -race -coverprofile=coverage.out -covermode=atomic ./... -v -cover"

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run --build-tags integration ./..."

[tasks.fmt]
description = "Run golangci-lint fmt"
run = "golangci-lint fmt"

[tasks.schema]
description = "Regenerate schema.json and schema.repo.json from the config types"
run = "go test ./internal/config -run TestSchemaDrift -update"

[tasks.check]
description = "Run all checks for PRs (tidy, lint, test)"
run = [
    { task = "tidy" },
    { task = "lint" },
    { task = "test" },
]

[tasks."dev:up"]
description = "Start the RustFS dev stack and create the bucket"
run = [
    "docker compose -f dev/compose.yaml up -d --wait",
    "go run ./dev/setup",
]

[tasks."dev:down"]
description = "Stop the RustFS dev stack and drop its data"
run = "docker compose -f dev/compose.yaml down -v"

[tasks.integration]
description = "Run the integration tests against RustFS (the dev stack when PRASSETS_TEST_S3_ENDPOINT is set, else a throwaway container)"
run = "go test -tags integration -count=1 ./test/integration/..."
